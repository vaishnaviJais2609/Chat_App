<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --bubble-me: #3b82f6;
            --bubble-other: #334155;
            --border-color: #334155;
            --system-msg: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: var(--container-bg);
            width: 100%;
            max-width: 800px;
            height: 90vh;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }


        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 40px;
            text-align: center;
        }

        #login-screen h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #login-screen p {
            color: var(--system-msg);
            margin-bottom: 30px;
        }

        #login-screen input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }

        #login-screen input:focus {
            border-color: var(--accent-color);
        }

        #login-screen button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        #login-screen button:hover {
            background-color: var(--accent-hover);
        }

        #login-screen button:active {
            transform: scale(0.98);
        }


        #chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
        }

        #status {
            font-size: 0.9rem;
            color: var(--system-msg);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444;
        }

        .status-dot.connected {
            background-color: #22c55e;
        }

        #chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }

        .message.me {
            align-self: flex-end;
        }

        .message.other {
            align-self: flex-start;
        }

        .message .sender {
            font-size: 0.8rem;
            color: var(--system-msg);
            margin-bottom: 4px;
            margin-left: 4px;
        }

        .message.me .sender {
            text-align: right;
            margin-right: 4px;
        }

        .message .text {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.me .text {
            background-color: var(--bubble-me);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.other .text {
            background-color: var(--bubble-other);
            color: white;
            border-bottom-left-radius: 4px;
        }

        .message.system {
            align-self: center;
            max-width: 90%;
            background: none;
        }

        .message.system .text {
            color: var(--system-msg);
            font-style: italic;
            font-size: 0.85rem;
            text-align: center;
            background: none;
            padding: 4px;
        }

        .chat-input-area {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input-area input:focus {
            border-color: var(--accent-color);
        }

        .chat-input-area input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-input-area button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .chat-input-area button:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .chat-input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: var(--border-color);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 600px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="login-screen">
            <h2>Chat App</h2>
            <p>Enter your username to join the conversation</p>
            <input id="username-input" placeholder="Your username" autocomplete="off" autofocus>
            <button id="join-btn">Join Chat</button>
        </div>


        <div id="chat-screen">
            <div class="chat-header">
                <h2>Chat App</h2>
                <div id="status">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">Connecting...</span>
                </div>
            </div>

            <div id="chat"></div>

            <div class="chat-input-area">
                <input id="message" placeholder="Type a message..." autocomplete="off" disabled>
                <button id="send" disabled>Send</button>
            </div>
        </div>
    </div>

    <script>
        const loginScreen = document.getElementById("login-screen");
        const chatScreen = document.getElementById("chat-screen");
        const usernameInput = document.getElementById("username-input");
        const joinBtn = document.getElementById("join-btn");

        const chat = document.getElementById("chat");
        const input = document.getElementById("message");
        const sendButton = document.getElementById("send");
        const statusText = document.getElementById("status-text");
        const statusDot = document.getElementById("status-dot");

        let username = "";
        let socket = null;


        function joinChat() {
            const name = usernameInput.value.trim();
            if (!name) {
                usernameInput.focus();
                return;
            }

            username = name;
            loginScreen.style.display = "none";
            chatScreen.style.display = "flex";
            connect();
        }

        joinBtn.addEventListener("click", joinChat);

        usernameInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                joinChat();
            }
        });


        function scrollToBottom() {
            chat.scrollTop = chat.scrollHeight;
        }

        function createMessageElement(name, text, type) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${type}`;

            if (type !== 'system') {
                const senderDiv = document.createElement("div");
                senderDiv.className = "sender";
                senderDiv.textContent = name;
                msgDiv.appendChild(senderDiv);
            }

            const textDiv = document.createElement("div");
            textDiv.className = "text";
            textDiv.textContent = text;
            msgDiv.appendChild(textDiv);

            return msgDiv;
        }

        function addMessage(name, text) {
            const type = (name === "You") ? "me" : "other";
            const msgEl = createMessageElement(name, text, type);
            chat.appendChild(msgEl);
            scrollToBottom();
        }

        function addSystemMessage(text) {
            const msgEl = createMessageElement("System", text, "system");
            chat.appendChild(msgEl);
            scrollToBottom();
        }

        function setConnected(connected) {
            input.disabled = !connected;
            sendButton.disabled = !connected;

            if (connected) {
                statusDot.classList.add("connected");
                input.focus();
            } else {
                statusDot.classList.remove("connected");
            }
        }


        function connect() {
            const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            const url = protocol + window.location.host + "/ws";

            socket = new WebSocket(url);

            socket.onopen = function () {
                statusText.textContent = "Connected as " + username;
                setConnected(true);
            };

            socket.onmessage = function (event) {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch (e) {
                    return;
                }

                if (data.error) {
                    addSystemMessage(data.error);
                    return;
                }

                addMessage(String(data.user), String(data.message));
            };

            socket.onclose = function (event) {
                setConnected(false);
                statusText.textContent = "Disconnected";

                if (event.reason) {
                    addSystemMessage("Disconnected: " + event.reason);
                } else if (event.code === 1008) {
                    addSystemMessage("Chat is full.");
                } else {
                    addSystemMessage("Connection closed. The server may be unavailable.");
                }
            };

            socket.onerror = function () {
                statusText.textContent = "Connection error";
                setConnected(false);
            };
        }

        function sendMessage() {
            const text = input.value.trim();

            if (text === "") {
                return;
            }

            if (!socket || socket.readyState !== WebSocket.OPEN) {
                addSystemMessage("Not connected. Message was not sent.");
                return;
            }

            socket.send(JSON.stringify({ user: username, message: text }));
            addMessage("You", text);
            input.value = "";
        }

        sendButton.addEventListener("click", sendMessage);

        input.addEventListener("keydown", function (event) {
            if (event.key === "Enter" && !event.isComposing) {
                event.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>

</html>
