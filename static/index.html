<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
        }

        #status {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        #chat {
            border: 1px solid #ccc;
            height: 400px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        #chat p {
            margin: 0 0 8px;
            overflow-wrap: anywhere;
        }

        #chat p.system {
            color: #888;
            font-style: italic;
        }

        input {
            width: 75%;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
        }
    </style>
</head>

<body>

<h2>Chat App</h2>

<div id="status">Connecting...</div>
<div id="chat"></div>

<input id="message" placeholder="Enter message" autocomplete="off" disabled>
<button id="send" disabled>Send</button>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendButton = document.getElementById("send");
const statusEl = document.getElementById("status");

let username = "";
while (!username) {
    username = prompt("Enter your username:");
    if (username) {
        username = username.trim();
    }
}

function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
}

// textContent / createTextNode only: never insert user text as HTML.
function addMessage(name, text) {
    const p = document.createElement("p");
    const b = document.createElement("b");

    b.textContent = name + ": ";
    p.appendChild(b);
    p.appendChild(document.createTextNode(text));

    chat.appendChild(p);
    scrollToBottom();
}

function addSystemMessage(text) {
    const p = document.createElement("p");

    p.className = "system";
    p.textContent = text;

    chat.appendChild(p);
    scrollToBottom();
}

function setConnected(connected) {
    input.disabled = !connected;
    sendButton.disabled = !connected;

    if (connected) {
        input.focus();
    }
}

let socket = null;

function connect() {
    const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
    const url = protocol + window.location.host + "/ws";

    socket = new WebSocket(url);

    socket.onopen = function() {
        statusEl.textContent = "Connected as " + username;
        setConnected(true);
    };

    socket.onmessage = function(event) {
        let data;

        try {
            data = JSON.parse(event.data);
        } catch (e) {
            return;
        }

        // Check if server sent an error message (e.g., "Chat is full")
        if (data.error) {
            addSystemMessage(data.error);
            return;
        }

        addMessage(String(data.user), String(data.message));
    };

    socket.onclose = function(event) {
        setConnected(false);
        statusEl.textContent = "Disconnected";

        if (event.reason) {
            addSystemMessage("Disconnected: " + event.reason);
        } else if (event.code === 1008) {
            addSystemMessage("Chat is full. Maximum 2 users allowed.");
        } else {
            addSystemMessage("Connection closed. The server may be unavailable.");
        }
    };

    socket.onerror = function() {
        statusEl.textContent = "Connection error";
    };
}

function sendMessage() {
    const text = input.value.trim();

    if (text === "") {
        return;
    }

    if (!socket || socket.readyState !== WebSocket.OPEN) {
        addSystemMessage("Not connected. Message was not sent.");
        return;
    }

    socket.send(JSON.stringify({ user: username, message: text }));

    // The server does not echo a message back to its sender.
    addMessage("You", text);

    input.value = "";
}

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault();
        sendMessage();
    }
});

connect();
</script>

</body>
</html>
